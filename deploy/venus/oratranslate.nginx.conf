location = /OraTranslate {
    return 302 /OraTranslate/;
}

# The trailing slash on proxy_pass removes the public /OraTranslate/ prefix
# before forwarding requests to the Python server.
location ^~ /OraTranslate/ {
    proxy_pass http://127.0.0.1:8010/;
    proxy_http_version 1.1;

    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Port $server_port;
    proxy_set_header X-Forwarded-Prefix /OraTranslate;

    proxy_buffering off;
    proxy_request_buffering off;
    proxy_read_timeout 24h;
    proxy_send_timeout 24h;
    proxy_socket_keepalive on;
    proxy_next_upstream off;
}
