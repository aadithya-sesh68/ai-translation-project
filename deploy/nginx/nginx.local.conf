# Self-contained Windows Nginx configuration for local reverse-proxy testing.
# Start the Python server on 127.0.0.1:8765 and browse http://localhost:8080.

worker_processes 1;
error_log logs/oci-speech-error.log info;
pid logs/oci-speech-nginx.pid;

events {
    worker_connections 1024;
}

http {
    default_type application/octet-stream;
    access_log logs/oci-speech-access.log;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    upstream oci_speech_python {
        server 127.0.0.1:8765;
        keepalive 16;
    }

    server {
        listen 8080;
        server_name localhost 127.0.0.1;

        location /ws/ {
            proxy_pass http://oci_speech_python;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Port $server_port;
            proxy_buffering off;
            proxy_request_buffering off;
            proxy_read_timeout 24h;
            proxy_send_timeout 24h;
            proxy_socket_keepalive on;
            proxy_next_upstream off;
        }

        location / {
            proxy_pass http://oci_speech_python;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Port $server_port;
            proxy_buffering off;
        }
    }
}
